[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ikea-supply-chain"
version = "2.7.3"
description = "Supply chain settlement client"
authors = [{ name = "宜家 供应链平台组", email = "scm-platform@example.com" }]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "ikea-common-sign>=1.4",
    "ikea-auth-sdk>=0.9",
]

[tool.scm]
tenant = "宜家"
namespace = "com.ikea.scm"
owner = "supply-chain-platform"
